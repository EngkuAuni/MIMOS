# Docker Compose for Mac Studio M4 - Development Mode
# - Code mounted as volumes for live reload
# - Edit from MacBook via Remote-SSH
# - Apple Metal (MPS) GPU acceleration

services:
  quran-verifier-mac-dev:
    build:
      context: ..
      dockerfile: Server/Dockerfile.mac-studio
    container_name: quran-verifier-mac-studio-dev
    ports:
      - "8501:8501"
    volumes:
      # Mount code directories for live editing
      - ../app_enhanced.py:/app/app_enhanced.py
      - ../config.py:/app/config.py
      - ../KDN_COMPLIANCE_CONFIG.py:/app/KDN_COMPLIANCE_CONFIG.py
      
      # Mount all code modules
      - ../models:/app/models
      - ../verification:/app/verification
      - ../triangulation:/app/triangulation
      - ../segmentation:/app/segmentation
      - ../preprocessing:/app/preprocessing
      - ../ui_components:/app/ui_components
      - ../utils:/app/utils
      - ../report:/app/report
      - ../config:/app/config
      
      # Mount database code
      - ../database/uthmani_db.py:/app/database/uthmani_db.py
      - ../database/page_mapper.py:/app/database/page_mapper.py
      - ../database/init_db.py:/app/database/init_db.py
      
      # Data volumes (persistent)
      - quran_database:/app/database
      # NOTE: models directory mounted from host (line 21) for live editing
      - quran_finetuning:/app/QariOCR_Finetuning
      - quran_uploads:/app/uploads
      - quran_reports:/app/reports
      
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PYTORCH_ENABLE_MPS_FALLBACK=1
      - USE_MPS=true
      # Enable Streamlit file watcher for auto-reload
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=auto
      - STREAMLIT_SERVER_RUN_ON_SAVE=true
      
    # Resource allocation for Mac Studio M4
    deploy:
      resources:
        limits:
          cpus: '12.0'      # Adjusted for 14-core system
          memory: 32G
        reservations:
          cpus: '6.0'
          memory: 16G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Shared volumes
volumes:
  quran_database:
    driver: local
  quran_models:
    driver: local
  quran_finetuning:
    driver: local
  quran_uploads:
    driver: local
  quran_reports:
    driver: local

