# Docker Compose for Mac Studio M4 (Production)
# Uses Apple Metal (MPS) for GPU acceleration

services:
  quran-verifier-mac:
    build:
      context: ..
      dockerfile: Server/Dockerfile.mac-studio
    container_name: quran-verifier-mac-studio
    ports:
      - "8501:8501"
    volumes:
      # Use named volumes for data persistence
      - quran_database:/app/database
      - quran_models:/app/models
      - quran_finetuning:/app/QariOCR_Finetuning
      - quran_uploads:/app/uploads
      - quran_reports:/app/reports
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PYTORCH_ENABLE_MPS_FALLBACK=1
      - USE_MPS=true
    # Resource limits for Mac Studio M4
    deploy:
      resources:
        limits:
          cpus: '12.0'      # Adjusted for 14-core system
          memory: 32G        # Reserve plenty for model
        reservations:
          cpus: '6.0'
          memory: 16G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Define named volumes
volumes:
  quran_database:
    driver: local
  quran_models:
    driver: local
  quran_finetuning:
    driver: local
  quran_uploads:
    driver: local
  quran_reports:
    driver: local

