services:
  quran-verifier:
    container_name: server
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      # Use named volumes for data persistence
      - quran_database:/app/database
      - quran_models:/app/models
      - quran_finetuning:/app/QariOCR_Finetuning
      - quran_uploads:/app/uploads
      - quran_reports:/app/reports
      - qari_cache:/cache
    mem_limit: "32g"
    shm_size: "2g"
    cpus: "8.0"
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - QARIOCR_SKIP_RAG=1
      - QARIOCR_CV_PREPROCESS=0
      - HF_HOME=/cache/hf
      - QARI_OCR_PATH=models/FT1_QariOCR
      - USE_MPS=true
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
    # Resource limits to prevent MacBook lag
    deploy:
      resources:
        limits:
          cpus: '8.0'       # Limit to 8 CPU cores
          memory: 32G         # Limit to 32GB RAM
        reservations:
          cpus: '4.0'
          memory: 16G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Define named volumes
volumes:
  quran_database:
    driver: local
  quran_models:
    driver: local
  quran_finetuning:
    driver: local
  quran_uploads:
    driver: local
  quran_reports:
    driver: local
  qari_cache:
    driver: local